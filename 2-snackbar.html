<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNACKBAR</title>
    <script type="module" crossorigin src="/goit-js-hw-10/2-snackbar.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-njWUcVeN.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CUZofXIC.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-DGUOsoVb.css">
  </head>
  <body>
    <main>
      <div class="container">
        <h1 class="main-title">SNACKBAR</h1>
        <a class="back-link" href="./index.html">Go back</a>
      </div>

      <form class="form">
        <label class="label-delay">
          Delay (ms)
          <input class="input-delay" type="number" name="delay" required />
        </label>

        <fieldset class="fieldset-area">
          <legend>State</legend>
          <label class="label-fieldset">
            <input type="radio" name="state" value="fulfilled" required />
            Fulfilled
          </label>
          <label class="label-fieldset">
            <input type="radio" name="state" value="rejected" required />
            Rejected
          </label>
        </fieldset>

        <button class="button-submit" type="submit">Create notification</button>
      </form>
    </main>
  </body>
</html>
